kind: AdaptiveDialog
modelDescription: >
  Researches stablecoin market changes in the last 24 hours, formats findings
  as a branded HTML report, and emails the report to a defined distribution list
  via Outlook through two shared Power Automate flows.

beginDialog:
  actions:

    # ── Step 1: Acknowledge & set time window ──────────────────────────────
    - kind: SetVariable
      variable: topic.windowEnd
      value: =utcNow()

    - kind: SetVariable
      variable: topic.windowStart
      value: =addHours(utcNow(), -24)

    - kind: SetVariable
      variable: topic.reportDate
      value: =text(utcNow(), "MMMM D, YYYY")

    - kind: SendActivity
      activity: >
        Researching stablecoin market changes for the last 24 hours
        (${topic.windowStart} – ${topic.windowEnd} UTC). This will take a moment…

    # ── Step 2: Research via GenerativeAnswers / Bing grounding ────────────
    - kind: SearchAndSummarizeContent
      variable: topic.researchResult
      userInput: >
        Provide a detailed summary of stablecoin market changes in the last
        24 hours. Cover: USDT, USDC, DAI, BUSD, FRAX, TUSD. Include current
        price and peg deviation, market cap change, 24h trading volume,
        regulatory news, protocol upgrades, issuer announcements, and relevant
        macro events. Cite sources with timestamps.

    # ── Step 3: Parse research into structured JSON ────────────────────────
    - kind: SetVariable
      variable: topic.structuredPayload
      value: =topic.researchResult

    # ── Step 4: Call Shared-FormatStablecoinReport ─────────────────────────
    - kind: InvokeFlowAction
      flowId: Shared-FormatStablecoinReport
      inputs:
        reportDate:       =topic.reportDate
        windowStart:      =topic.windowStart
        windowEnd:        =topic.windowEnd
        generatedAt:      =utcNow()
        executiveSummary: =topic.structuredPayload.executiveSummary
        macroContext:     =topic.structuredPayload.macroContext
        coins:            =topic.structuredPayload.coins
        newsItems:        =topic.structuredPayload.newsItems
      outputs:
        htmlBody:   topic.htmlBody
        coinCount:  topic.coinCount
        newsCount:  topic.newsCount

    # ── Step 5: Build subject line ─────────────────────────────────────────
    - kind: SetVariable
      variable: topic.emailSubject
      value: ="Stablecoin Market Update – " & topic.reportDate & " | 24-Hour Summary"

    # ── Step 6: Call Shared-StablecoinEmailFlow ────────────────────────────
    - kind: InvokeFlowAction
      flowId: Shared-StablecoinEmailFlow
      inputs:
        htmlBody: =topic.htmlBody
        subject:  =topic.emailSubject
      outputs:
        status:    topic.sendStatus
        timestamp: topic.sendTimestamp

    # ── Step 7: Confirm to user ────────────────────────────────────────────
    - kind: ConditionNode
      condition: =topic.sendStatus == "sent"
      consequent:
        - kind: SendActivity
          activity: >
            Done! The stablecoin report for ${topic.reportDate} was sent successfully
            to the distribution list at ${topic.sendTimestamp} UTC.
            Coins tracked: ${topic.coinCount} | News items: ${topic.newsCount}.
      alternate:
        - kind: SendActivity
          activity: >
            The report was generated but email delivery failed. Please check the
            Shared-StablecoinEmailFlow run history in Power Automate for details.
