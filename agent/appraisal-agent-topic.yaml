kind: AdaptiveDialog
modelDescription: >
  CALLABLE topic — invoked by Shared-AppraisalReviewOrchestrator (a Power
  Automate flow) via the Copilot Studio connector's "Run a topic" action.
  This is the inverse of the previous design: previously this agent called
  a flow (InvokeFlowAction) using the "When Copilot Studio calls a flow"
  trigger, which this tenant's DLP policy blocks (the shared_powervirtualagents
  connector). Now a flow calls INTO this topic instead, using a different
  connector — verify in your own tenant that this connector is not grouped
  with the blocked one before relying on this design; some tenants classify
  the two together, in which case this inversion does not actually route
  around the block.

  This topic has no conversational entry point, no trigger phrases, and
  sends no chat activity — it takes a PDF file as an input, extracts 17
  credit-risk data points itself via an inline generative Prompt action
  configured directly on this topic, and returns the parsed/validated JSON
  as topic outputs. All analyst-facing communication (acknowledgment,
  summary, missing-fields flag, workbook link, rejections) now happens in
  Shared-AppraisalReviewOrchestrator, via a Teams channel post — not here.

# ── Callable topic contract ───────────────────────────────────────────────
# Configured via the topic's own Settings > Inputs/Outputs panel in the
# Copilot Studio designer, not something the YAML editor can fully create
# for you — see DEPLOYMENT.md, Part E, for the manual steps this requires.
inputs:
  - name: document
    type: File
    description: >
      The appraisal review PDF to extract data from. Bound to the calling
      flow's Get_File_Content output (Shared-AppraisalReviewOrchestrator,
      Call_Extraction_Agent action body.document).

outputs:
  - name: extractionJson
    type: String
    description: >
      The raw JSON string produced by the inline Prompt action. The calling
      flow re-parses this itself (Parse_Agent_Response) against the same
      17-field schema — this topic's own parse (below) is a validation gate,
      not a substitute for the flow having typed access to the fields.
  - name: parseSucceeded
    type: Boolean
    description: >
      True only if this topic's own ParseJSON check passed. The calling
      flow branches on this (Condition_Extraction_Ok) before trusting
      extractionJson's shape — mirrors what checkParsedOk used to guard
      against in the previous, chat-triggered version of this topic.

triggers:
  - kind: OnInvokeTopic
    id: main
    actions:

      # ── Step 1: Extract the 17 fields, inline, right here in the topic ───
      # Ad hoc "AI Builder" Prompt action added directly to this step in the
      # Copilot Studio designer (Add an action > AI Builder > Prompt,
      # choosing "Create a new prompt inline" — NOT a saved catalog prompt).
      # See agent/appraisal-agent-instructions.md, "Extraction Requirements"
      # and "Output Requirements", for the exact instructions and JSON
      # schema pasted into this action. Still a generative/LLM call under
      # the hood; what this design avoids is a separately managed AI
      # Builder resource and any AI Builder connector call in either flow.
      - kind: InvokePromptAction
        id: extractFieldsInline
        promptInputs:
          document: =System.Activity.Inputs.document
          instructions: >
            Paste verbatim, from agent/appraisal-agent-instructions.md: the
            "## Extraction Requirements" section through the end of the
            "## Output Requirements" section (the 17-field table, missing-
            data rules, and the exact JSON schema/example). Do not
            paraphrase — the JSON key names in that file are what
            Shared-AppraisalReviewOrchestrator's Parse_Agent_Response step
            depends on.
        responseFormat: Json
        output: topic.extractionRawJson

      # ── Step 2: Validate the model's JSON, in Power Fx ────────────────────
      - kind: SetVariable
        id: parseExtraction
        variable: topic.extraction
        value: =ParseJSON(topic.extractionRawJson)

      - kind: SetVariable
        id: setParseSucceeded
        variable: topic.parseSucceeded
        value: =Not(IsError(topic.extraction))

      # ── Step 3: Return outputs to the calling flow ────────────────────────
      # No SendActivity anywhere in this topic — there is no chat conversation
      # to send activity into. EndDialog's outputs are what the calling
      # flow's Call_Extraction_Agent action receives as its response body.
      - kind: EndDialog
        id: returnOutputs
        outputs:
          extractionJson: =topic.extractionRawJson
          parseSucceeded: =topic.parseSucceeded
