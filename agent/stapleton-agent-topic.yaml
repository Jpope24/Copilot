kind: AdaptiveDialog
modelDescription: >
  Researches Stapleton neighborhood news, real estate, infrastructure,
  community events, and safety updates over the last 24 hours, formats the
  findings as a branded HTML report via Shared-FormatStapletonReport, then
  emails the report to the distribution list via Shared-StablecoinEmailFlow.

beginDialog:
  actions:

    # ── Step 1: Set time window ────────────────────────────────────────────
    - kind: SetVariable
      variable: topic.windowEnd
      value: =utcNow()

    - kind: SetVariable
      variable: topic.windowStart
      value: =addHours(utcNow(), -24)

    - kind: SetVariable
      variable: topic.reportDate
      value: =text(utcNow(), "MMMM D, YYYY")

    - kind: SendActivity
      activity: >
        Researching Stapleton community activity for the last 24 hours
        (${topic.windowStart} – ${topic.windowEnd} UTC). Gathering real estate,
        infrastructure, community, business, safety, and government updates…

    # ── Step 2: Research via Generative Answers / Bing grounding ──────────
    - kind: SearchAndSummarizeContent
      variable: topic.rawResearch
      userInput: >
        Research and summarize the latest news and activity in the Stapleton
        (Central Park) neighborhood of Denver, Colorado from the last 24 hours.
        Cover the following categories:
        (1) Real estate — new listings, price changes, closings, MLS activity;
        (2) Infrastructure — permits, construction milestones, road closures;
        (3) Community — HOA decisions, school district news, resident announcements;
        (4) Business — openings, closures, commercial leases;
        (5) Safety — police incident reports, fire activity, traffic alerts;
        (6) Government — Denver City Council actions, zoning, park announcements.
        Also provide a real estate snapshot: median list price, active listing
        count, average days on market, and new listings in the last 24 hours.
        List any community events scheduled in the next 14 days.
        Cite every item with source name and publish timestamp.

    # ── Step 3: Structure research into payload ────────────────────────────
    - kind: SetVariable
      variable: topic.generatedAt
      value: =utcNow()

    - kind: SetVariable
      variable: topic.payload
      value: =topic.rawResearch

    # ── Step 4: Call Shared-FormatStapletonReport ──────────────────────────
    - kind: InvokeFlowAction
      flowId: Shared-FormatStapletonReport
      inputs:
        reportDate:       =topic.reportDate
        windowStart:      =topic.windowStart
        windowEnd:        =topic.windowEnd
        generatedAt:      =topic.generatedAt
        executiveSummary: =topic.payload.executiveSummary
        developments:     =topic.payload.developments
        realEstateSnapshot: =topic.payload.realEstateSnapshot
        events:           =topic.payload.events
      outputs:
        htmlBody:   topic.htmlBody
        devCount:   topic.devCount
        eventCount: topic.eventCount

    # ── Step 5: Build subject line ─────────────────────────────────────────
    - kind: SetVariable
      variable: topic.emailSubject
      value: ="Stapleton Community Briefing – " & topic.reportDate & " | 24-Hour Update"

    # ── Step 6: Call Shared-StablecoinEmailFlow (shared email sender) ──────
    - kind: InvokeFlowAction
      flowId: Shared-StablecoinEmailFlow
      inputs:
        htmlBody:   =topic.htmlBody
        subject:    =topic.emailSubject
        to:         =["community-lead@yourorg.com", "development-team@yourorg.com", "realestate-analyst@yourorg.com"]
        cc:         =["operations@yourorg.com", "research-team@yourorg.com"]
        importance: ="Normal"
      outputs:
        status:    topic.sendStatus
        timestamp: topic.sendTimestamp

    # ── Step 7: Confirm result ─────────────────────────────────────────────
    - kind: ConditionNode
      condition: =topic.sendStatus == "sent"
      consequent:
        - kind: SendActivity
          activity: >
            Done! The Stapleton briefing for ${topic.reportDate} was sent
            successfully at ${topic.sendTimestamp} UTC.
            Developments: ${topic.devCount} | Upcoming events: ${topic.eventCount}.
      alternate:
        - kind: SendActivity
          activity: >
            The report was generated but email delivery failed. Please check
            the Shared-StablecoinEmailFlow run history in Power Automate for
            details and re-trigger if needed.
